name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Hooks and the smoke test (rust and git are preinstalled on the runner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Hooks
        # pre-commit-update bumps hook revisions: not a CI check.
        run: uvx prek run --all-files --show-diff-on-failure
        env:
          SKIP: pre-commit-update
      - run: tests/smoke.sh

  smoke-macos:
    # The script targets macOS too (bash 3.2, BSD tools).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: /bin/bash tests/smoke.sh
