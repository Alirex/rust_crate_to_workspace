exclude: |
  (?x)^(
    \.idea/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    # Finds bugs in shell scripts (rules: .shellcheckrc).
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    # Formats shell scripts.
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--write, --simplify, --indent, "2", --case-indent]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/Alirex/pre-commit-just
    # Justfile formatter.
    rev: v0.2.1
    hooks:
      - id: format-justfile

  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        files: \.(json|ya?ml|md)$

  - repo: https://github.com/gitleaks/gitleaks
    # Secret scanning of staged changes; whole history: `just q-secrets`.
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (whole history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true

  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    # https://pypi.org/project/pre-commit-update/
    rev: v0.10.0
    hooks:
      - id: pre-commit-update
